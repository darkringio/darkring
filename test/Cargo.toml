[package]
name = "perps-test"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = { workspace = true }
perps-program = { path = "../program", features = ["circuits"] }
perps-sdk = { path = "../sdk" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["reqwest", "solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program = { workspace = true, features = ["client"] }
spr-program-test = { workspace = true, features = ["localnet"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[[test]]
name = "perps"
path = "tests/perps.rs"

[[test]]
name = "devnet"
path = "tests/devnet.rs"
