[package]
name = "perps-desk"
version = "0.1.0"
edition.workspace = true
publish = false

# The devnet desk: three maker wallets held by this process, and a trading
# account for every browser that opens a session. The browser keeps the key
# that signs; this process holds the account's viewing and nullifier keys
# while the session lasts, to build and prove. A real deployment would prove
# in the browser too.

[dependencies]
anyhow = { workspace = true }
perps-program = { path = "../program", features = ["circuits"] }
perps-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["reqwest", "solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program = { workspace = true, features = ["client"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }
