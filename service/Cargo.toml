[package]
name = "perps-desk"
version = "0.1.0"
edition.workspace = true
publish = false

# The devnet desk: three maker wallets held by this process, and a seat for
# every browser that opens a session. A trader's keys stay in its browser,
# which builds and proves its own transactions; this process assembles and
# sends them, and relays the browser's requests to Helius.

[dependencies]
anyhow = { workspace = true }
perps-program = { path = "../program", features = ["circuits"] }
perps-sdk = { path = "../sdk" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["reqwest", "solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program = { workspace = true, features = ["client"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }
wincode = { workspace = true }
