[package]
name = "perps-desk"
version = "0.1.0"
edition.workspace = true
publish = false

# The devnet desk: one trader wallet and three maker wallets held by this
# process, driven over a local HTTP API by the web app. A demo: a real
# deployment would keep the trader's keys and proving in the browser.

[dependencies]
anyhow = { workspace = true }
perps-program = { path = "../program", features = ["circuits"] }
perps-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
spr-client = { workspace = true, features = ["reqwest", "solana-rpc"] }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-program = { workspace = true, features = ["client"] }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
